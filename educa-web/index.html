<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSTP - Sistema Integrado de Consulta Educacional</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>"
    />

    <link rel="stylesheet" href="estilo.css" />
  </head>

  <body class="bg-custom-main">
    <nav class="navbar shadow-md p-4">
      <div class="container mx-auto flex justify-between items-center">
        <div
          class="flex items-center gap-3 logo text-white font-bold tracking-wide"
        >
          <img
            src="../educa-web/imagem/brasao.png"
            alt="Brasão EduSTP"
            class="w-10 h-10 object-contain rounded-md shadow-sm"
          />
          <span>Edu<span class="text-emerald-400">STP</span></span>
        </div>

        <span
          class="text-xs text-white font-medium tracking-wider uppercase hidden sm:inline"
        >
          Portal de Consulta Institucional
        </span>
      </div>
    </nav>

    <main
      class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8"
    >
      <div class="md:col-span-2 space-y-6">
        <section class="card-painel shadow-sm">
          <h2 class="subtitulo-painel mb-4">Pesquisar no Sistema</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
            <div class="sm:col-span-1">
              <input
                type="text"
                id="inputBusca"
                placeholder="Nome da escola ou curso..."
                class="input-custom-sm"
              />
            </div>
            <div class="sm:col-span-1">
              <select id="selectRegiaoBusca" class="input-custom-sm">
                <option value="">Todas as Regiões (STP)</option>
                <option value="Água Grande">Água Grande</option>
                <option value="Mé-Zóchi">Mé-Zóchi</option>
                <option value="Cantagalo">Cantagalo</option>
                <option value="Lobata">Lobata</option>
                <option value="Lembá">Lembá</option>
                <option value="Caué">Caué</option>
                <option value="Região Autónoma do Príncipe">
                  Região Autónoma do Príncipe
                </option>
              </select>
            </div>
            <div class="sm:col-span-1 flex gap-2">
              <button
                id="btnBuscar"
                class="btn-primary flex-1 flex items-center justify-center gap-2"
              >
                <i class="fas fa-search"></i> Buscar
              </button>
              <button
                id="btnLimpar"
                class="btn-secondary px-4 flex items-center justify-center"
              >
                <i class="fas fa-eraser"></i>
              </button>
            </div>
          </div>
        </section>

        <section>
          <h2 class="titulo-seccao mb-4">Instituições Encontradas</h2>
          <div
            id="containerCards"
            class="grid grid-cols-1 sm:grid-cols-2 gap-4"
          ></div>
        </section>
      </div>

      <aside class="md:col-span-1">
        <section class="card-painel shadow-sm">
          <h2 class="subtitulo-painel mb-4" id="tituloFormulario">
            Gerir Instituição
          </h2>

          <form id="formGerir" class="space-y-4">
            <div>
              <label class="label-form">Nome da Escola</label>
              <input
                type="text"
                id="inputNome"
                required
                placeholder="Ex: Liceu Nacional"
                class="input-custom-sm"
              />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="label-form">Região</label>
                <select id="inputRegiao" required class="input-custom-sm">
                  <option value="">Escolha...</option>
                  <option value="Água Grande">Água Grande</option>
                  <option value="Mé-Zóchi">Mé-Zóchi</option>
                  <option value="Cantagalo">Cantagalo</option>
                  <option value="Lobata">Lobata</option>
                  <option value="Lembá">Lembá</option>
                  <option value="Caué">Caué</option>
                  <option value="Região Autónoma do Príncipe">Príncipe</option>
                </select>
              </div>
              <div>
                <label class="label-form">Tipo</label>
                <select id="inputTipo" required class="input-custom-sm">
                  <option value="">Escolha...</option>
                  <option value="Ensino Superior">Ensino Superior</option>
                  <option value="Ensino Secundário">Ensino Secundário</option>
                  <option value="Ensino Técnico / Profissional">
                    Técnico / Prof.
                  </option>
                </select>
              </div>
            </div>

            <div>
              <label class="label-form">Cursos (Separados por Vírgula)</label>
              <textarea
                id="txtCursos"
                rows="3"
                required
                placeholder="Ex: Engenharia Informática, Direito"
                class="input-custom-sm"
              ></textarea>
            </div>

            <button
              type="submit"
              id="btnGuardar"
              class="btn-primary w-full flex items-center justify-center gap-2"
            >
              <i class="fas fa-save"></i> Guardar Dados
            </button>
          </form>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>

    <footer class="bg-white border-t border-gray-100 mt-12 py-6">
      <div
        class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-gray-500"
      >
        <div class="flex items-center gap-2">
          <span class="font-bold text-emerald-600">EduSTP</span>
          <span>&copy; 2026 — Todos os direitos reservados.</span>
        </div>
        <div class="flex items-center gap-1">
          <span>Desenvolvido por:</span>
          <span
            class="font-semibold text-gray-800 hover:text-blue-600 transition-colors"
          >
            <i class="fas fa-code mr-1 text-blue-500"></i> Admilson Bragança
          </span>
        </div>
      </div>
    </footer>
  </body>
</html>
